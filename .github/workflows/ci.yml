name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: cargo test --locked

  hk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: Determine diff range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "check_args=--pr" >> "$GITHUB_OUTPUT"
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              # No prior state (e.g. first-ever push) - scan/validate everything.
              echo "check_args=--all" >> "$GITHUB_OUTPUT"
              echo "range=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "check_args=--from-ref $before --to-ref ${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "range=$before..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Scan files (betterleaks, detect_private_key)
        run: hk check ${{ steps.range.outputs.check_args }}

