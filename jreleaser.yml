project:
  name: echoit
  description: Echoes back the argument you pass it.
  links:
    homepage: https://github.com/merikan/echoit
  authors:
    - Peter Merikan
  license: MIT

platform:
  replacements:
    'osx-x86_64': 'x86_64-apple-darwin'
    'osx-aarch_64': 'aarch64-apple-darwin'
    'linux-x86_64': 'x86_64-unknown-linux-gnu'
    'linux-aarch_64': 'aarch64-unknown-linux-gnu'
    'windows-x86_64': 'x86_64-pc-windows-msvc'

release:
  github:
    owner: merikan
    name: echoit
    overwrite: false
    tagName: 'v{{projectVersion}}'
    changelog:
      # Pre-generated by git-cliff in the release workflow; used as-is.
      external: RELEASE_NOTES.md

distributions:
  echoit:
    type: BINARY
    executable:
      windowsExtension: exe
    artifacts:
      - path: dist/echoit-x86_64-apple-darwin.tar.gz
        platform: osx-x86_64
      - path: dist/echoit-aarch64-apple-darwin.tar.gz
        platform: osx-aarch_64
      - path: dist/echoit-x86_64-unknown-linux-gnu.tar.gz
        platform: linux-x86_64
      - path: dist/echoit-aarch64-unknown-linux-gnu.tar.gz
        platform: linux-aarch_64
      - path: dist/echoit-x86_64-pc-windows-msvc.zip
        platform: windows-x86_64

    brew:
      active: ALWAYS
      repository:
        owner: merikan
        name: homebrew-tools
        # Token resolved from JRELEASER_HOMEBREW_GITHUB_TOKEN (see release.yml).

    scoop:
      active: ALWAYS
      repository:
        owner: merikan
        name: scoop-bucket
        # Token resolved from JRELEASER_SCOOP_GITHUB_TOKEN (see release.yml).

    chocolatey:
      active: NEVER
      # Flip to ALWAYS once you have a chocolatey.org account + API key.
      # Needs: username, apiKey (JRELEASER_CHOCOLATEY_API_KEY), remoteBuild: true
      #   (this pipeline has no Windows runner with choco/powershell installed).

    snap:
      active: NEVER
      remoteBuild: true
      # Flip to ALWAYS once you have a Snap Store account + exported login.
      # Needs: exportedLogin, packageName, and a repository for the generated
      #   snapcraft.yaml.
